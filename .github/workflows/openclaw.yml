name: OpenClaw Telegram Bot

on:
  workflow_dispatch:
    inputs:
      command:
        description: 'Comando a ejecutar en el runner activo'
        required: false
        default: ''

jobs:
  run-openclaw:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Run OpenClaw
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
        run: |
          if [ -n "${{ github.event.inputs.command }}" ]; then
            npx ${{ github.event.inputs.command }}
          else
            npx openclaw gateway --allow-unconfigured
          fi
