name: OpenClaw Telegram Bot

on:
  workflow_dispatch:

jobs:
  run-openclaw:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Run OpenClaw with Full Log Interceptor
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
        run: |
          rm -f /tmp/openclaw_fifo
          mkfifo /tmp/openclaw_fifo

          # Monitorear stdout y stderr en tiempo real
          cat /tmp/openclaw_fifo | while read -r line; do
            echo "$line"
            if echo "$line" | grep -qi "pairing approve"; then
              CODE=$(echo "$line" | grep -oE '[A-Z0-9]{8}' | tail -n 1)
              if [ -n "$CODE" ]; then
                echo ">>> CÓDIGO DETECTADO EN LOGS: $CODE. EJECUTANDO APROBACIÓN... <<<"
                npx openclaw pairing approve telegram "$CODE" || true
              fi
            fi
          done &

          # Iniciar gateway redirigiendo stdout Y stderr al FIFO
          npx openclaw gateway --allow-unconfigured > /tmp/openclaw_fifo 2>&1
