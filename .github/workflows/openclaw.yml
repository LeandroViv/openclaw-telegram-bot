name: OpenClaw Telegram Bot

on:
  workflow_dispatch:

jobs:
  run-openclaw:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Setup Auth and Run OpenClaw
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
        run: |
          # Crear estructura y forzar el archivo de configuración con el canal de telegram y tu ID autorizado
          mkdir -p ~/.openclaw
          cat << 'JSON' > ~/.openclaw/config.json
          {
            "channels": {
              "telegram": {
                "enabled": true,
                "token": "${{ secrets.TELEGRAM_BOT_TOKEN }}",
                "adminUsers": ["7043094764"],
                "allowUsers": ["7043094764"]
              }
            }
          }
          JSON

          # Iniciar OpenClaw leyendo esa configuración
          npx openclaw gateway
