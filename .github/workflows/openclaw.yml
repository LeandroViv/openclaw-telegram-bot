name: OpenClaw + Ollama Runner

on:
  push:
    branches:
      - main
  schedule:
    - cron: '0 */6 * * *'
  workflow_dispatch:
    inputs:
      command:
        description: 'Comando de OpenClaw a ejecutar'
        required: false
        default: 'gateway --allow-unconfigured'
      model:
        description: 'Modelo de Ollama a descargar/usar'
        required: false
        default: 'qwen2.5:0.5b'

concurrency:
  group: openclaw-telegram
  cancel-in-progress: true

jobs:
  openclaw-runner:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repositorio
        uses: actions/checkout@v4

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Instalar e Iniciar Ollama
        run: |
          curl -fsSL https://ollama.com/install.sh | sh
          OLLAMA_KEEP_ALIVE=-1 OLLAMA_NUM_PARALLEL=1 OMP_NUM_THREADS=4 OLLAMA_CONTEXT_SIZE=1024 ollama serve &
          echo "Esperando a que Ollama levante..."
          sleep 8

      - name: Descargar y Precargar Modelo
        run: |
          MODEL_NAME="${{ github.event.inputs.model }}"
          if [ -z "$MODEL_NAME" ]; then
            MODEL_NAME="qwen2.5:0.5b"
          fi
          echo "Descargando modelo: $MODEL_NAME"
          ollama pull "$MODEL_NAME"
          echo "Precargando modelo en memoria..."
          curl -s http://127.0.0.1:11434/api/generate -d "{\"model\": \"$MODEL_NAME\", \"prompt\": \"hi\", \"keep_alive\": -1, \"stream\": false}" > /dev/null

      - name: Instalar OpenClaw
        run: |
          npm install -g openclaw

      - name: Configurar OpenClaw para Ollama y Telegram
        run: |
          mkdir -p ~/.openclaw
          node -e '
            const fs = require("fs");
            const modelName = process.env.OLLAMA_MODEL || "qwen2.5:0.5b";
            const config = {
              gateway: { auth: { mode: "none" } },
              agents: {
                defaults: {
                  model: "ollama/" + modelName
                }
              },
              models: {
                providers: {
                  ollama: {
                    baseUrl: "http://127.0.0.1:11434",
                    apiKey: "ollama"
                  }
                }
              },
              plugins: {
                entries: {
                  "memory-core": { enabled: false }
                }
              },
              channels: {
                telegram: {
                  enabled: true,
                  botToken: process.env.BOT_TOKEN,
                  dmPolicy: "open",
                  allowFrom: ["*"],
                  groups: { "*": { requireMention: false } }
                }
              }
            };
            fs.writeFileSync("/home/runner/.openclaw/openclaw.json", JSON.stringify(config, null, 2));
          '
        env:
          BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          OLLAMA_MODEL: ${{ github.event.inputs.model }}

      - name: Ejecutar Comando OpenClaw
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          OPENCLAW_BYPASS_PAIRING: "true"
        run: |
          CMD_NAME="${{ github.event.inputs.command }}"
          if [ -z "$CMD_NAME" ]; then
            CMD_NAME="gateway --allow-unconfigured"
          fi
          echo "Ejecutando: openclaw $CMD_NAME"
          openclaw $CMD_NAME
