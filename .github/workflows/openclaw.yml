name: OpenClaw Telegram Bot

on:
  workflow_dispatch:

jobs:
  run-openclaw:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Run OpenClaw with Pre-configured Auth
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
        run: |
          # Crear el directorio de configuración y precargar el usuario autorizado
          mkdir -p ~/.openclaw
          cat << 'JSON' > ~/.openclaw/openclaw.json
          {
            "gateway": {
              "mode": "local"
            },
            "channels": {
              "telegram": {
                "enabled": true,
                "token": "${{ secrets.TELEGRAM_BOT_TOKEN }}",
                "allowUsers": ["7043094764"]
              }
            }
          }
          JSON

          # Iniciar el Gateway con la configuración precargada
          npx openclaw gateway --allow-unconfigured
