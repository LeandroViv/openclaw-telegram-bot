- name: Configurar OpenClaw para Ollama y Telegram
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
        run: |
          mkdir -p ~/.openclaw
          cat << EOF > ~/.openclaw/openclaw.json
          {
            "gateway": {
              "auth": { "mode": "none" }
            },
            "agents": {
              "defaults": {
                "model": "ollama/${{ github.event.inputs.model }}"
              }
            },
            "models": {
              "providers": {
                "ollama": {
                  "baseUrl": "http://127.0.0.1:11434"
                }
              }
            },
            "channels": {
              "telegram": {
                "enabled": true,
                "botToken": "$TELEGRAM_BOT_TOKEN",
                "dmPolicy": "open",
                "groups": {
                  "*": {
                    "requireMention": false
                  }
                }
              }
            }
          }
          EOF
