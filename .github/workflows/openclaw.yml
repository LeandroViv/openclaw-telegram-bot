name: OpenClaw Telegram Bot

on:
  workflow_dispatch:

jobs:
  run-openclaw:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Setup Auth and Run OpenClaw
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
        run: |
          mkdir -p ~/.openclaw
          cat << 'JSON' > ~/.openclaw/openclaw.json
          {
            "gateway": {
              "mode": "local"
            }
          }
          JSON
          cp ~/.openclaw/openclaw.json ~/.openclaw/config.json

          npx openclaw gateway --allow-unconfigured
