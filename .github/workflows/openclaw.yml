- name: Configurar OpenClaw para Ollama y Telegram
        env:
          BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          OLLAMA_MODEL: ${{ github.event.inputs.model }}
        run: |
          mkdir -p ~/.openclaw
          node -e '
            const fs = require("fs");
            const modelName = process.env.OLLAMA_MODEL || "qwen2.5:1.5b";
            const config = {
              gateway: { auth: { mode: "none" } },
              agents: {
                defaults: {
                  model: "ollama/" + modelName
                }
              },
              models: {
                providers: {
                  ollama: {
                    baseUrl: "http://127.0.0.1:11434",
                    apiKey: "ollama"
                  }
                }
              },
              plugins: {
                entries: {
                  "memory-core": { enabled: false }
                }
              },
              channels: {
                telegram: {
                  enabled: true,
                  botToken: process.env.BOT_TOKEN,
                  dmPolicy: "open",
                  allowFrom: ["*"],
                  groups: { "*": { requireMention: false } }
                }
              }
            };
            fs.writeFileSync("/home/runner/.openclaw/openclaw.json", JSON.stringify(config, null, 2));
          '
