name: OpenClaw Telegram Bot

on:
  workflow_dispatch:

jobs:
  run-openclaw:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install OpenClaw
        run: npm install -g openclaw

      - name: Run OpenClaw paired approval and start gateway
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
        run: |
          # Intentar aprobar el código de emparejamiento previo si está activo
          openclaw pairing approve telegram NGXMEVQH || true
          
          # Iniciar el Gateway de OpenClaw permitiendo tu usuario
          openclaw gateway --allow-user 7043094764
