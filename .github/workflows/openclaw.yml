name: OpenClaw + Ollama Runner

on:
  workflow_dispatch:
    inputs:
      command:
        description: 'Comando de OpenClaw a ejecutar (ej: "gateway --allow-unconfigured", "doctor", "status")'
        required: false
        default: 'gateway --allow-unconfigured'
      model:
        description: 'Modelo de Ollama a descargar/usar'
        required: false
        default: 'qwen2.5:1.5b'

jobs:
  openclaw-runner:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repositorio
        uses: actions/checkout@v4

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Instalar e Iniciar Ollama
        run: |
          curl -fsSL https://ollama.com/install.sh | sh
          ollama serve &
          echo "Esperando a que Ollama levante..."
          sleep 8

      - name: Descargar Modelo de Ollama
        run: |
          echo "Descargando modelo: ${{ github.event.inputs.model }}"
          ollama pull ${{ github.event.inputs.model }}

      - name: Instalar OpenClaw
        run: |
          npm install -g openclaw

      - name: Configurar OpenClaw para Ollama y Telegram
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
        run: |
          mkdir -p ~/.openclaw
          cat << EOF > ~/.openclaw/openclaw.json
          {
            "gateway": {
              "auth": { "mode": "none" }
            },
            "models": {
              "providers": {
                "ollama": {
                  "baseUrl": "http://127.0.0.1:11434"
                }
              },
              "default": "ollama/${{ github.event.inputs.model }}"
            },
            "channels": {
              "telegram": {
                "enabled": true,
                "botToken": "$TELEGRAM_BOT_TOKEN",
                "dmPolicy": "allow",
                "groups": {
                  "*": {
                    "requireMention": false
                  }
                }
              }
            }
          }
          EOF

      - name: Ejecutar Comando OpenClaw
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          OPENCLAW_BYPASS_PAIRING: "true"
        run: |
          echo "Ejecutando: openclaw ${{ github.event.inputs.command }}"
          openclaw ${{ github.event.inputs.command }}
