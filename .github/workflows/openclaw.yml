name: OpenClaw Telegram Bot

on:
  workflow_dispatch:
    inputs:
      command:
        description: 'Comando opcional a ejecutar (ej: openclaw pairing approve telegram CODIGO)'
        required: false
        default: ''

jobs:
  run-openclaw:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Pre-configure OpenClaw Permissions
        run: |
          mkdir -p ~/.openclaw
          cat << 'JSON' > ~/.openclaw/openclaw.json
          {
            "channels": {
              "telegram": {
                "allowedUsers": ["7043094764"]
              }
            }
          }
          JSON

      - name: Run OpenClaw Command or Gateway
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
        run: |
          if [ -n "${{ github.event.inputs.command }}" ]; then
            npx ${{ github.event.inputs.command }}
          else
            npx openclaw gateway --allow-unconfigured
          fi
