name: OpenClaw Telegram Bot

on:
  workflow_dispatch:

jobs:
  run-openclaw:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Configure and Run OpenClaw
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
        run: |
          # Configurar la lista de usuarios autorizados vía CLI
          npx openclaw config set channels.telegram.allowUsers '["7043094764"]' || true
          
          # Iniciar el Gateway
          npx openclaw gateway --allow-unconfigured
